name: Release Please

# Runs on every push to main. release-please scans the Conventional Commits since
# the last release and maintains a single "release PR": it bumps the version across
# package.json + the extra-files (tauri.conf.json, Cargo.toml, metainfo, spec) and
# regenerates CHANGELOG.md. Merging that PR tags the release (vX.Y.Z) and creates the
# GitHub Release. Until merged, the PR keeps updating itself with new commits.
#
# When that release is created, the `build` job below builds the macOS app, signs the
# updater bundle and uploads it to the release together with `latest.json` — the file
# the in-app updater polls (tauri.conf.json → plugins.updater.endpoints). Without it
# every update check answered 404: releases v0.1.8–v0.1.13 were published with no
# assets at all. `workflow_dispatch` re-runs the build for an existing tag (a failed
# build, or a release published before this job existed).
on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing release tag to build and upload assets for (e.g. v0.1.14)"
        required: true
        type: string

permissions:
  contents: write
  pull-requests: write

# Avoid two release runs racing on rapid pushes.
concurrency:
  group: release-please-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release-please:
    if: ${{ github.event_name == 'push' }}
    runs-on: ubuntu-latest
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
    steps:
      - uses: googleapis/release-please-action@v4
        id: release
        with:
          # A PAT (not the default GITHUB_TOKEN) so that opening/updating the release PR
          # triggers other workflows — notably ci.yml — on that PR. Events raised by the
          # built-in GITHUB_TOKEN are intentionally suppressed by GitHub and would never
          # start CI. Falls back to GITHUB_TOKEN if the secret isn't set (PR opens, but
          # CI won't run on it).
          token: ${{ secrets.RELEASE_PLEASE_TOKEN || secrets.GITHUB_TOKEN }}
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

      # release-please bumps Cargo.toml but has no updater for Cargo.lock, so the lock's
      # `melo` entry drifts to the old version and shows up as a dangling local change
      # after every release. Patch just that one version line (everything else stays
      # byte-for-byte) directly on the release PR branch, so the merge already carries a
      # consistent lockfile. Runs only while a release PR is open.
      - name: Sync Cargo.lock in the release PR
        if: ${{ steps.release.outputs.pr }}
        env:
          GH_TOKEN: ${{ secrets.RELEASE_PLEASE_TOKEN || secrets.GITHUB_TOKEN }}
          PR_JSON: ${{ steps.release.outputs.pr }}
        run: |
          set -euo pipefail
          BRANCH=$(printf '%s' "$PR_JSON" | jq -r .headBranchName)
          git clone --branch "$BRANCH" --depth 1 \
            "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" repo
          cd repo
          VERSION=$(jq -r .version package.json)
          # Rewrite only the `version = "..."` line of the [[package]] block named "melo".
          awk -v ver="$VERSION" '
            /^name = "melo"$/ { inmelo = 1 }
            inmelo && /^version = / { sub(/"[^"]*"/, "\"" ver "\""); inmelo = 0 }
            { print }
          ' src-tauri/Cargo.lock > Cargo.lock.tmp && mv Cargo.lock.tmp src-tauri/Cargo.lock
          if git diff --quiet; then
            echo "Cargo.lock already at ${VERSION} — nothing to do."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -am "chore: sync Cargo.lock to ${VERSION}"
          git push origin "$BRANCH"

  # Build the app for the release that was just created and attach the bundles, their
  # signatures and latest.json to it.
  #
  # Updater signing: TAURI_SIGNING_PRIVATE_KEY must be the private half of the pubkey
  # in tauri.conf.json (plugins.updater.pubkey). The app refuses any update whose
  # signature does not verify against that pubkey, so the two can only change together
  # — and installed copies keep trusting the pubkey they were built with.
  #
  # `createUpdaterArtifacts` lives in tauri.updater.conf.json, applied only here: with
  # it in the main config a plain local `npm run tauri build` fails for lack of the key.
  build:
    name: Build & publish (${{ matrix.target }})
    needs: release-please
    if: ${{ !cancelled() && (github.event_name == 'workflow_dispatch' || needs.release-please.outputs.release_created == 'true') }}
    runs-on: macos-latest
    strategy:
      fail-fast: false
      matrix:
        target: [aarch64-apple-darwin, x86_64-apple-darwin]
    env:
      RELEASE_TAG: ${{ inputs.tag || needs.release-please.outputs.tag_name }}
      # Deliberately empty: an env RUSTFLAGS (even empty) replaces the
      # `-C target-cpu=native` of src-tauri/.cargo/config.toml. "native" means the
      # CPU of the build machine: on the virtualized arm64 runner it reports fewer
      # features than the target guarantees and `ring` refuses to compile (its
      # const assert on aarch64-apple-darwin — the v0.1.14 arm64 build died there),
      # and a binary tuned for the runner is wrong to ship to other Macs anyway.
      RUSTFLAGS: ""
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.RELEASE_TAG }}

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
          key: ${{ matrix.target }}

      - name: Install dependencies
        run: npm ci

      - uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: ${{ env.RELEASE_TAG }}
          args: --target ${{ matrix.target }} --config src-tauri/tauri.updater.conf.json
