name: CI

# Minimal CI: type-check + test suite. Runs on every PR and on pushes to main.
# Does NOT build or release the app — distribution is handled separately.
on:
  pull_request:
  push:
    branches: [main]

# Cancel superseded runs on the same ref to save CI minutes.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend:
    name: Type-check & test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Node 24: the search tests exercise the real FTS5 index through the
      # built-in node:sqlite, which only became available without a flag in
      # 23.4. On an older runtime those suites skip themselves rather than fail,
      # so CI has to be the place where they actually run.
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Type-check
        run: npx tsc --noEmit

      - name: Lint
        run: npm run lint

      - name: Test
        run: npx vitest run
